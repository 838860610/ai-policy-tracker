name: 部署 Pages

# 站点文件全部位于 site/ 目录，而 Pages 的 "Deploy from a branch" 只支持发布仓库根
# 或 /docs，无法指定 site/，因此改用 Actions 部署：把 site/ 打包成产物发布出去。
# 对外 URL 不变（site/ 即站点根）：https://838860610.github.io/ai-policy-tracker/
#
# 一次性手动设置：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
#
# 触发说明：用 workflow_run 而不是 push——bot（GITHUB_TOKEN）提交的 commit 不会再触发
# push 事件，ci.yml / monitor.yml 自动提交的产物也就不会触发重新部署；workflow_run
# 在这两个工作流跑完后触发，无论提交者是人是 bot 都能覆盖到。
on:
  workflow_run:
    workflows: ["数据校验", "政策更新监控"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {} # 支持在 Actions 页面手动重新部署

# 同时只允许一个部署任务在跑，避免相互覆盖
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # 上游工作流失败时不部署；手动触发不受此限制
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages # 不存在时 GitHub 会自动创建
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write # 部署到 GitHub Pages
      id-token: write # OIDC 校验
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装 CJK 字体（确保 OG 卡片中文正常渲染）
        # 运行器默认不带中文矢量字体，缺字会让 gen_og_image.py 回退到默认位图字体、
        # 导致 OG 卡片中文变成豆腐块；显式安装 Noto CJK 后脚本才能正确渲染中文。
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 安装依赖（生成 OG 社交卡片）
        run: pip install --quiet pillow

      - name: 部署时生成社交分享卡片
        # OG 卡片在部署阶段现场生成，而非由 CI 提交回 main：避免字体/依赖环境差异
        # 导致每次 CI 都产生一个自动提交、进而造成本地与远端分叉。
        run: python scripts/gen_og_image.py

      - uses: actions/configure-pages@v6

      # 只发布 site/：它是站点根，因此 site/index.html → /、site/robots.txt → /robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
