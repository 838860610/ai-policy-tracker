name: 政策更新监控

# 每周一北京时间 09:00（UTC 01:00）自动检查各产品政策页面变化（含个人版/企业版独立条款链接），
# 检测结果与正文快照提交入库——首页会读取展示监控状态。
# 变更核实不再在 CI 内自动完成：检测到变化后，由本地仓库调用 policy-change-verify skill
# 逐条人工核实并更新 site/data/policies/{id}.json（含 timeline），不再自动建 Issue。
on:
  schedule:
    - cron: "0 1 * * 1" # 每周一 09:00 北京时间
  workflow_dispatch: {} # 支持在 Actions 页面手动触发

# 定时触发与手动触发可能重叠，同一时间只允许一个监控任务在跑
concurrency:
  group: monitor-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装浏览器抓取依赖（fetch_method=browser 的产品需要，如 ChatGPT/OpenAI 被 Cloudflare 拦截）
        run: pip install -r requirements-browser.txt

      - name: 缓存 Playwright 浏览器二进制
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: 安装无头浏览器
        run: playwright install --with-deps chromium

      - name: 运行政策更新检查
        # 所有产品均监控：普通站点走 requests；fetch_method=browser 的（如 ChatGPT）走无头浏览器。
        # 可选增强：仓库 Secrets 里配置 OPENAI_CF_CLEARANCE（真人浏览器过验证后导出的令牌）可提升过
        # Cloudflare 概率；但该令牌绑 IP 且短时效，CI 数据中心 IP 仍可能被挑战——此时 ChatGPT 会被
        # 标记为 suspicious（空壳）而非误报 changed，不会污染待核实队列。
        env:
          OPENAI_CF_CLEARANCE: ${{ secrets.OPENAI_CF_CLEARANCE }}
        run: python scripts/check_updates.py

      - name: 提交监控状态、快照与待核实队列
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # update_status.json / snapshots/ 已入库（首页展示监控状态 + 核实回路的持久历史）；
          # pending_verification.json 是检测→核实的跨轮交接物。三者一并提交。
          git add site/generated/update_status.json site/generated/pending_verification.json
          git add site/generated/snapshots
          git diff --cached --quiet || (git commit -m "monitor: 政策更新检查 $(date -u +%F)" && git push)
