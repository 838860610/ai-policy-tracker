name: 数据校验

# PR 与主分支推送时自动校验数据结构和 README 汇总表一致性
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 数据结构校验
        run: python scripts/validate_data.py

      - name: README 汇总表一致性检查
        run: python scripts/gen_readme_table.py --check

      - name: 生成数据 bundle（首页加载加速）
        run: python scripts/gen_data_bundle.py

      - name: 提交 bundle（仅 main 推送且有变化时）
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f：data/bundle.json 在 .gitignore 中（自动生成），普通 add 会报错
          git add -f data/bundle.json
          git diff --cached --quiet || (git commit -m "chore: CI 重新生成 data/bundle.json" && git push)
