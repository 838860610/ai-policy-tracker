name: 数据校验

# PR 与主分支推送时自动运行回归测试、数据结构校验和 README 汇总表一致性检查，
# 并在 main 推送后重新生成 site/generated/bundle.json（社交分享卡片改由部署工作流现场生成，避免每次 CI 都产生自动提交造成分叉）。
on:
  pull_request:
  push:
    branches: [main]

# 同一分支的多次推送只保留最新一次运行，避免并发任务重复提交
concurrency:
  group: repo-write-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

# 最小权限：默认只读，写权限仅在 publish job 中单独授予
permissions:
  contents: read

jobs:
  validate:
    name: 校验与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 回归测试
        run: python -m unittest discover -s tests -v

      - name: 数据结构校验
        run: python scripts/validate_data.py

      - name: README 汇总表一致性检查
        run: python scripts/gen_readme_table.py --check

      - name: 文档页一致性检查
        run: python scripts/gen_docs.py --check

  publish:
    name: 生成并提交产物
    needs: validate
    # 仅 main 分支推送时提交自动生成物；PR（含 fork）无权写入
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        # 本 job 要 git push 生成物，必须保留 checkout 写入的凭据，否则报
        # "could not read Username for 'https://github.com'"。写权限已由
        # permissions: contents: write 限定到最小范围；validate job 不 push，
        # 那边仍用 persist-credentials: false。

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成数据 bundle 与文档页
        run: |
          python scripts/gen_data_bundle.py
          python scripts/gen_docs.py

      - name: 生成后复验
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/gen_docs.py --check

      - name: 提交 bundle 与文档页（有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 运行期间可能有人 push了新提交，直接 push 会被拒（fetch first）
          git pull --rebase --autostash origin main
          git add site/generated/bundle.json site/docs/*.html
          git diff --cached --quiet || (git commit -m "chore: CI 重新生成 bundle.json 与文档页" && git push)
